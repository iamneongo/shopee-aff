<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 340px; margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #222; }
    header { background: #ee4d2d; color: #fff; padding: 12px 14px; font-size: 15px; font-weight: 700; }
    .body { padding: 14px; }
    .bridge { font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; background: #f2f2f2; display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #d1242f; }
    .dot.on { background: #1a7f37; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    button { margin-top: 12px; width: 100%; background: #ee4d2d; color: #fff; border: 0; border-radius: 6px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    button.sec { background: #fff; color: #ee4d2d; border: 1px solid #ee4d2d; margin-top: 8px; }
    .status { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .status.ok { color: #1a7f37; }
    .status.err { color: #d1242f; }
    .result { margin-top: 10px; display: none; }
    .result.show { display: block; }
    .linkbox { display: flex; gap: 6px; }
    .linkbox input { font-size: 12px; }
    .copy { width: auto; margin: 0; padding: 8px 12px; font-size: 12px; }
    .warn { background: #fff8e6; border: 1px solid #f0d98a; border-radius: 6px; padding: 10px; font-size: 12px; display: none; }
    .warn.show { display: block; }
    .warn button { margin-top: 8px; }
    details { margin-top: 12px; font-size: 12px; }
    summary { cursor: pointer; color: #666; }
    pre { background: #0d1117; color: #e6edf3; padding: 10px; border-radius: 6px; font-size: 11px; max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <header>🛒 Shopee Aff Bridge</header>
  <div class="body">
    <div class="bridge">
      <span class="dot" id="dot"></span>
      <span id="bridgeText">Bridge: đang kiểm tra…</span>
    </div>

    <div class="warn" id="warn">
      Chưa mở tab <b>affiliate.shopee.vn</b>. Hãy mở & đăng nhập rồi thử lại.
      <button id="openBtn">Mở Shopee Affiliate</button>
    </div>

    <label for="link">Link Shopee gốc</label>
    <input id="link" placeholder="https://s.shopee.vn/xxxxx" />
    <label for="subid">SubID (tuỳ chọn)</label>
    <input id="subid" placeholder="vd: web" />
    <button id="genBtn">▶ Tạo affiliate link</button>
    <button id="reportBtn" class="sec">📊 Báo cáo 7 ngày</button>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <label>Short link</label>
      <div class="linkbox">
        <input id="short" readonly />
        <button class="copy" id="copyBtn">Copy</button>
      </div>
    </div>
    <pre id="raw" style="display:none;"></pre>

    <details>
      <summary>Cấu hình server</summary>
      <label for="wsUrl">WebSocket server</label>
      <input id="wsUrl" placeholder="ws://127.0.0.1:4000/bridge" />
      <button class="sec" id="saveUrlBtn">Lưu & kết nối lại</button>
    </details>
  </div>
  <script src="pagefn.js"></script>
  <script src="popup.js"></script>
</body>
</html>
